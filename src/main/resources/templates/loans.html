<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Loans · Imagine Lanka Bank</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Loans</h1>
                <p class="page-subtitle">Apply for a loan or manage your existing loans.</p>
            </div>
        </div>

        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <div class="card">
            <h2 class="section-title">Your Loans</h2>
            <table>
                <thead>
                <tr>
                    <th>Type</th>
                    <th>Principal</th>
                    <th>Outstanding</th>
                    <th>Monthly Payment</th>
                    <th>Status</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="loan : ${loans}">
                    <td th:text="${loan.loanType}">PERSONAL</td>
                    <td th:text="${#numbers.formatDecimal(loan.principal, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                    <td th:text="${#numbers.formatDecimal(loan.outstandingBalance, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                    <td th:text="${#numbers.formatDecimal(loan.monthlyPayment, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                    <td>
                        <span class="pill"
                              th:classappend="${loan.status == 'APPROVED'} ? 'success' : (${loan.status == 'PENDING'} ? 'warn' : 'info')"
                              th:text="${loan.status}">STATUS</span>
                    </td>
                    <td>
                        <form th:if="${loan.status == 'APPROVED'}" th:action="@{'/loans/' + ${loan.id} + '/pay'}" method="post">
                            <button type="submit" class="btn btn-ghost btn-sm">Pay Installment</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(loans)}">
                    <td colspan="6" class="empty-state">No loans yet.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2 class="section-title">Apply for a Loan</h2>
            <form th:action="@{/loans/apply}" method="post">
                <div class="grid grid-2">
                    <div class="form-group">
                        <label for="accountId">Disburse to</label>
                        <select id="accountId" name="accountId" required>
                            <option th:each="account : ${accounts}" th:value="${account.id}" th:text="${account.nickname}">Account</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="loanType">Loan type</label>
                        <select id="loanType" name="loanType" required>
                            <option value="PERSONAL">Personal Loan</option>
                            <option value="HOME">Home Loan</option>
                            <option value="AUTO">Auto Loan</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="principal2">Loan amount</label>
                        <input type="number" id="principal2" name="principal2" step="0.01" min="1" placeholder="500000.00" required/>
                    </div>
                    <div class="form-group">
                        <label for="termMonths">Term (months)</label>
                        <input type="number" id="termMonths" name="termMonths" min="3" max="360" placeholder="24" required/>
                    </div>
                </div>
                <button type="submit" class="btn btn-accent">Submit Application</button>
                <p class="helper-text" style="margin-top:14px;">Applications are reviewed automatically within about 15 seconds in this demo.</p>
            </form>
        </div>
    </main>
</div>

<div th:replace="~{fragments/chat-widget :: widget}"></div>
<script th:src="@{/js/chat.js}"></script>
</body>
</html>
