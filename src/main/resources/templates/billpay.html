<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Bill Pay · Imagine Lanka Bank</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Pay a Bill</h1>
                <p class="page-subtitle">Settle utilities, mobile and credit card bills instantly.</p>
            </div>
        </div>

        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <div class="card" style="max-width:460px;">
            <h2 class="section-title">New Bill Payment</h2>
            <form th:action="@{/billpay}" method="post">
                <div class="form-group">
                    <label for="accountId">Pay from</label>
                    <select id="accountId" name="accountId" required>
                        <option th:each="account : ${accounts}" th:value="${account.id}"
                                th:text="${account.nickname + ' — ' + account.currency + ' ' + #numbers.formatDecimal(account.balance, 1, 'COMMA', 2, 'POINT')}">
                            Account
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="billerId">Biller</label>
                    <select id="billerId" name="billerId" required>
                        <option th:each="biller : ${billers}" th:value="${biller.id}"
                                th:text="${biller.name + ' (' + biller.category + ')'}">
                            Biller
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0.01" placeholder="2500.00" required/>
                </div>
                <button type="submit" class="btn btn-accent">Pay Bill</button>
            </form>
        </div>
    </main>
</div>

<div th:replace="~{fragments/chat-widget :: widget}"></div>
<script th:src="@{/js/chat.js}"></script>
</body>
</html>
