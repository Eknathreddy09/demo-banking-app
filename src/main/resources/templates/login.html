<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Sign in · Imagine Lanka Bank</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-mark">ILB</div>
            <h1>Imagine Lanka Bank</h1>
            <p>Sign in to manage your accounts</p>
        </div>

        <div class="alert alert-error" th:if="${param.error}">Invalid username or password.</div>
        <div class="alert alert-success" th:if="${param.logout}">You have been signed out.</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="kumara" required autofocus/>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required/>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Sign in</button>
        </form>

        <p class="hint">Demo login: <strong>kumara</strong> / <strong>Welcome11!</strong></p>
    </div>
</div>
</body>
</html>
